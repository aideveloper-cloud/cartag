# ใช้งาน: ตั้งค่า .env (ดู .env.example) แล้วรัน  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BASE_URL: ${BASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ต้องตั้ง ADMIN_PASSWORD ใน .env}
      MAX_TRIP_KM: ${MAX_TRIP_KM:-1000}
      SELFIE_RETENTION_DAYS: ${SELFIE_RETENTION_DAYS:-180}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    # เปิดเฉพาะในเครื่อง ให้ reverse proxy (Caddy ที่มีอยู่บนเซิร์ฟเวอร์) ส่งต่อมา — ดู deploy/Caddyfile
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  # Caddy ของโปรเจกต์นี้เอง — ใช้เฉพาะเซิร์ฟเวอร์ที่ยังไม่มี web server บนพอร์ต 80/443
  # เปิดด้วย: docker compose --profile caddy up -d --build
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
